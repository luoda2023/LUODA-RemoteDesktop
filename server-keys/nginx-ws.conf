# LUODA WebSocket 反向代理配置
# 在已有的 OpenResty/nginx 443 server 块中添加以下两个 location
# 路径：通常在 /usr/local/openresty/nginx/conf/ 或 /etc/nginx/conf.d/
#
# 作用：让手机端通过 wss://rev.dicad.cn/ws/id (443端口) 连接 hbbs
# 解决移动网络(4G/5G)封锁21116-21119端口导致手机无法连接的问题

# ====== 将以下内容添加到 443 server 块中 ======

# WebSocket 代理: hbbs (rendezvous) → /ws/id
location /ws/id {
    proxy_pass http://127.0.0.1:21118;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# WebSocket 代理: hbbr (relay) → /ws/relay
location /ws/relay {
    proxy_pass http://127.0.0.1:21119;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ====== 操作步骤 ======
# 1. SSH 登录服务器: ssh root@47.114.75.115
# 2. 找到 nginx 配置: find / -name "nginx.conf" -o -name "*.conf" 2>/dev/null | grep -i nginx
#    通常在: /usr/local/openresty/nginx/conf/nginx.conf
#    或:     /usr/local/openresty/nginx/conf/conf.d/*.conf
# 3. 找到 listen 443 ssl 的 server 块,添加上面两个 location
# 4. 测试配置: /usr/local/openresty/nginx/sbin/nginx -t
# 5. 重新加载: /usr/local/openresty/nginx/sbin/nginx -s reload
# 6. 验证:
#    curl -sk -H "Upgrade: websocket" -H "Connection: Upgrade" \
#      -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
#      -H "Sec-WebSocket-Version: 13" \
#      -o /dev/null -w "%{http_code}" "https://rev.dicad.cn/ws/id"
#    应返回 101
