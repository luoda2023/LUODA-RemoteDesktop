# LUODA nginx WebSocket reverse proxy
# Place this in /etc/nginx/conf.d/ or include in server block
# Requires nginx with stream module and WebSocket proxy support
#
# This proxies /ws/id    -> hbbs:21118  (rendezvous WebSocket)
# and     /ws/relay -> hbbr:21119  (relay WebSocket)
# so that mobile clients on carrier networks (4G/5G) that block
# non-standard ports can reach hbbs/hbbr through port 443 (wss://).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rev.dicad.cn;

    # SSL certificates (adjust paths to your Let's Encrypt or other certs)
    ssl_certificate     /etc/nginx/ssl/rev.dicad.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/rev.dicad.cn.key;

    # Existing website (LUODA homepage) - keep as default location
    location / {
        root /var/www/luoda;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # WebSocket proxy for hbbs (rendezvous)
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket needs long timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket proxy for hbbr (relay)
    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
