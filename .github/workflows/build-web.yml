permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
  packages: read

name: Build LUODA Web

on:
  workflow_dispatch:
  push:
    branches: [master,v2.0.0,v2.0.1,v2.1.1]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-web.yml'

jobs:
  build-web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: |
          LUODA_VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          echo "LUODA_VERSION=$LUODA_VERSION" >> $GITHUB_ENV
          echo "Version: $LUODA_VERSION"

      - name: Setup Flutter
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Build Web
        run: |
          cd flutter
          # Generate web platform files (index.html etc) if missing
          if [ ! -f web/index.html ]; then
            echo "=== Creating web platform files ==="
            flutter create --platforms=web . 2>&1
          fi
          # Extract web deps (ogv.js for video codec support)
          if [ -f web/web_deps.tar.gz ]; then
            echo "=== Extracting web dependencies ==="
            tar xzf web/web_deps.tar.gz -C web/
          fi
          flutter pub get
          # Patch qr_code_scanner for Flutter 3.47: platformViewRegistry moved to dart:ui_web
          QR_WEB=$(find $HOME/.pub-cache/hosted/pub.dev -path '*qr_code_scanner-1.0.1/lib/src/web/flutter_qr_web.dart' 2>/dev/null | head -1)
          if [ -n "$QR_WEB" ] && ! grep -q 'dart:ui_web' "$QR_WEB"; then
            echo "=== Patching qr_code_scanner web API ==="
            sed -i "s/import 'dart:ui' as ui;/import 'dart:ui' as ui;\nimport 'dart:ui_web' as ui_web;/" "$QR_WEB"
            sed -i 's/ui\.platformViewRegistry/ui_web.platformViewRegistry/g' "$QR_WEB"
          fi
          echo "=== Building web ==="
          flutter build web --release 2>&1
          echo "=== Verifying build ==="
          ls -la build/web/
          echo "---"
          ls -la build/web/main.dart.js 2>/dev/null || echo "CRITICAL: main.dart.js MISSING!"
          echo "=== Total size ==="
          du -sh build/web/

      - name: Package Web
        run: |
          cd flutter/build
          mv web LUODA-web
          tar czf LUODA-web.tar.gz LUODA-web
          ls -la LUODA-web.tar.gz

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: LUODA-Web
          path: flutter/build/LUODA-web.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          prerelease: false
          tag_name: v${{ env.LUODA_VERSION }}
          files: flutter/build/LUODA-web.tar.gz
      - name: Upload runtime logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs-web
          path: .auto_build_logs/
          if-no-files-found: ignore

